name: Production UI Check

on:
  schedule:
    - cron: '0 23 * * *'   # כל לילה 02:00 שעון ישראל (23:00 UTC)
  workflow_dispatch:         # הרצה ידנית מ-GitHub UI

jobs:
  prod-ui-test:
    name: Full User Journey on Production
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production UI tests (all 5 users)
        id: playwright
        run: npx playwright test tests/prod-ui-test.spec.ts --project=prod-users --reporter=list
        continue-on-error: true

      - name: Upload screenshots (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-screenshots-${{ github.run_id }}
          path: tests/screenshots/
          retention-days: 14

      - name: Upload failure report
        uses: actions/upload-artifact@v4
        if: steps.playwright.outcome == 'failure'
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Send alert on failure
        if: steps.playwright.outcome == 'failure'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.AGENT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"issues\":[\"Playwright production UI tests failed — run #${{ github.run_id }}\",\"בדוק screenshots: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"]}" \
            "https://work-hunter-five.vercel.app/api/agent/alert" \
            || true

      - name: Fail the job if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
